name: test shared Golden release

on:
  pull_request:
    paths:
      - "tools/release/**"
      - "tools/runtime/**"
      - "tools/golden-bootstrap.py"
      - "tests/test_golden_*.py"
      - ".github/workflows/shared-release.yml"
      - ".github/workflows/test-shared-release.yml"
  push:
    branches: [main, master]
    paths:
      - "tools/release/**"
      - "tools/runtime/**"
      - "tools/golden-bootstrap.py"
      - "tests/test_golden_*.py"
      - ".github/workflows/shared-release.yml"
      - ".github/workflows/test-shared-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run offline shared release regressions
        run: |
          python3 -B -m unittest tools.release.tests.test_release \
            tests.test_golden_bootstrap tests.test_golden_runtime \
            tests.test_golden_environment tests.test_golden_grading
